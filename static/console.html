<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopio Support Console</title>
<link rel="icon" href="/static/brand/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Shopio theme: tokens from the Shopio deck and logo */
  :root {
    --bg: #f5f8fd; --surface: #ffffff; --surface-2: #f3f6fc; --hover: #eef3fc; --border: #e3eaf7;
    --text: #1b2559; --muted: #5a6683; --faint: #9aa4bd;
    --rail: #1b2559; --rail-text: #c9d3ea; --rail-muted: #8e9cc0; --rail-active: #26347a;
    --accent: #1f4fd8; --accent-2: #3b7cf7; --accent-soft: #e4eeff; --logo-1: #00b6fa; --logo-2: #006ff2;
    --human: #6d3fd8; --human-soft: #f4effe; --orange: #f28c28;
    --ok: #15a05b; --ok-soft: #e3f5eb; --bad: #e5484d; --bad-soft: #fdecec; --warn: #e07a10; --warn-soft: #fff7ec;
    --shadow: 0 1px 2px rgba(27, 37, 89, .05), 0 10px 26px -16px rgba(27, 37, 89, .3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0f27; --surface: #0d1330; --surface-2: #151d42; --hover: #18214a; --border: rgba(255,255,255,.09);
      --text: #eef2fb; --muted: #8e9cc0; --faint: #6b7799;
      --rail: #070b1f; --rail-text: #c9d3ea; --rail-muted: #6b7799; --rail-active: #1c2a63;
      --accent: #3b7cf7; --accent-2: #5b95ff; --accent-soft: #1c2a63;
      --human: #a585ff; --human-soft: #221a48;
      --ok: #3ccf8e; --ok-soft: #10301f; --bad: #ff7a7e; --bad-soft: #3a1a1e; --warn: #f7b955; --warn-soft: #2e220e;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
         font: 14px/1.5 "Inter", "Noto Sans Thai", system-ui, -apple-system, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  .shell { display: grid; grid-template-columns: 232px 360px 1fr; height: 100%; }

  /* rail */
  .rail { background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; }
  .brand { padding: 6px 10px 22px; color: var(--rail-muted); font-size: 11.5px; font-weight: 600; }
  .brand img.full { height: 26px; display: block; margin-bottom: 4px; }
  .brand .mk { display: none; width: 34px; height: 34px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .logo svg { width: 17px; height: 17px; }
  .navlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--rail-muted); padding: 10px 10px 6px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 0; background: none;
         color: var(--rail-text); cursor: pointer; text-align: left; width: 100%; }
  .nav:hover { background: rgba(255,255,255,.04); }
  .nav[aria-current="true"] { background: var(--rail-active); color: #fff; }
  .nav svg { width: 18px; height: 18px; opacity: .85; flex: none; }
  .nav span { flex: 1; }
  .count { min-width: 22px; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; text-align: center;
           background: rgba(255,255,255,.08); color: var(--rail-text); }
  .count.hot { background: var(--orange); color: #fff; }
  .me { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,.07); display: flex; gap: 10px; align-items: center; }
  .me .av { width: 32px; height: 32px; border-radius: 50%; background: var(--human); display: grid; place-items: center;
            font-size: 12px; font-weight: 600; color: #fff; flex: none; }
  .me input { width: 100%; background: transparent; border: 0; color: #fff; padding: 2px 0; outline: 0; border-bottom: 1px dashed transparent; }
  .me input:hover, .me input:focus { border-bottom-color: var(--rail-muted); }
  .me small { display: block; color: var(--rail-muted); font-size: 11px; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--rail-muted); padding: 8px 10px 0; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #3ee6a1; }
  .live.off i { background: #ff6b5a; }

  /* list */
  .list { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  .list header { padding: 20px 18px 12px; }
  .list h2 { margin: 0; font: 800 20px/1.2 "Plus Jakarta Sans", "Inter", sans-serif; letter-spacing: -.02em; }
  .list p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .seg { display: flex; gap: 4px; margin-top: 12px; background: var(--surface-2); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
  .seg button { flex: 1; border: 0; background: none; padding: 5px 8px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 500; }
  .items { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .item { display: flex; gap: 12px; padding: 12px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; position: relative; width: 100%;
          background: none; text-align: left; }
  .item:hover { background: var(--hover); }
  .item[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
  .item .av { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; font-weight: 600; font-size: 13px; }
  .item .av svg { width: 18px; height: 18px; }
  .av.refund { background: var(--accent-soft); color: var(--accent); }
  .av.budget { background: var(--warn-soft); color: var(--warn); }
  .av.person { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); border-radius: 50%; }
  .item .body { flex: 1; min-width: 0; }
  .item .l1 { display: flex; gap: 8px; align-items: baseline; }
  .item .l1 b { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .l1 time { font-size: 11.5px; color: var(--faint); flex: none; }
  .item .l2 { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .l3 { margin-top: 5px; display: flex; gap: 6px; align-items: center; }
  .pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .pill.pending, .pill.queued { background: var(--warn-soft); color: var(--warn); }
  .pill.approved { background: var(--ok-soft); color: var(--ok); }
  .pill.rejected { background: var(--bad-soft); color: var(--bad); }
  .pill.ai { background: var(--accent-soft); color: var(--accent); }
  .pill.active { background: var(--human-soft); color: var(--human); }
  .pill.queued::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .amount-sm { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 60px 24px; }
  .empty img { width: 110px; margin-bottom: 8px; }
  .empty b { display: block; color: var(--text); margin-bottom: 4px; }

  /* detail */
  .detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .dhead { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; min-height: 72px; }
  .dhead .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); flex: none; }
  .dhead .t { flex: 1; min-width: 0; }
  .dhead h3 { margin: 0; font: 800 17px/1.25 "Plus Jakarta Sans", "Inter", "Noto Sans Thai", sans-serif; letter-spacing: -.01em; }
  .dhead .s { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .back { display: none; border: 0; background: none; padding: 6px; margin-left: -8px; cursor: pointer; color: var(--muted); }
  .back svg { width: 20px; height: 20px; }
  .dbody { flex: 1; overflow-y: auto; padding: 24px; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; cursor: pointer;
         display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; color: #fff; }
  .btn.green { background: var(--ok); border: 0; color: #fff; }
  .btn.red { background: var(--surface); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); color: var(--bad); }
  .btn.red:hover { background: var(--bad-soft); }
  .btn:disabled { opacity: .5; cursor: default; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
  .ap-hero { padding: 22px 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .ap-hero .big { font: 800 36px/1.1 "Plus Jakarta Sans", "Inter", sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ap-hero .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border-top: 1px solid var(--border); }
  .facts div { padding: 14px 24px; border-right: 1px solid var(--border); }
  .facts div:last-child { border-right: 0; }
  .facts dt { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .mech { margin: 16px 0; padding: 12px 16px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--border); font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; }
  .mech code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; }
  .mech svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .decide { padding: 18px 24px; }
  .decide label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 6px; }
  .decide textarea, .reply textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); resize: vertical; min-height: 64px; outline: 0; }
  .decide textarea:focus, .reply textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .decide .row { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; flex-wrap: wrap; }
  .result { padding: 16px 24px; display: flex; gap: 12px; align-items: center; }
  .result.approved { background: var(--ok-soft); color: var(--ok); } .result.rejected { background: var(--bad-soft); color: var(--bad); }
  .result { border-radius: 0 0 16px 16px; }
  .result svg { width: 22px; height: 22px; flex: none; }
  .result b { display: block; }
  .result span { color: var(--text); font-size: 13px; }
  .section-t { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12.5px; text-transform: none; letter-spacing: 0; }

  /* transcript */
  .tx { display: flex; flex-direction: column; gap: 3px; }
  .tx.mini { max-height: 280px; overflow-y: auto; padding: 14px; }
  .m { display: flex; flex-direction: column; max-width: 72%; }
  .m.customer { align-self: flex-start; }
  .m.ai, .m.human { align-self: flex-end; align-items: flex-end; }
  .m .who { font-size: 11px; color: var(--faint); margin: 8px 6px 2px; }
  .m .b { padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.customer .b { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .m.ai .b { background: var(--accent-soft); border-bottom-right-radius: 5px; }
  .m.human .b { background: var(--human); color: #fff; border-bottom-right-radius: 5px; }
  .m .who img { width: 16px; height: 16px; border-radius: 50%; vertical-align: -4px; margin-right: 4px; }
  .tx .sys { align-self: center; font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; margin: 10px 0; }
  .tx .apref { align-self: flex-end; font-size: 12px; margin: 8px 0; padding: 6px 10px; border-radius: 10px; border: 1px dashed var(--border); color: var(--muted); cursor: pointer; background: none; }
  .tx .apref:hover { border-color: var(--accent); color: var(--accent); }
  .callout { margin-bottom: 18px; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
  .callout svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .callout b { color: var(--text); }
  .reply { padding: 14px 24px 18px; background: var(--surface); border-top: 1px solid var(--border); }
  .reply form { display: flex; gap: 10px; align-items: flex-end; }
  .reply textarea { min-height: 44px; max-height: 140px; resize: none; }
  .reply .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); gap: 10px; flex-wrap: wrap; }
  .takeover { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .takeover p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  .placeholder { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
  .placeholder img { width: 150px; animation: floaty 3.2s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .placeholder b { display: block; font: 800 18px "Plus Jakarta Sans", Inter, sans-serif; color: var(--text); margin-top: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; pointer-events: none;
           background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 9; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 1100px) { .shell { grid-template-columns: 76px 320px 1fr; } .rail .brand span, .brand .full, .nav span, .navlabel, .me div, .live span { display: none; }
                               .nav { justify-content: center; position: relative; } .nav .count { position: absolute; top: 2px; right: 4px; min-width: 18px; padding: 0 5px; font-size: 10px; } .brand { display: flex; justify-content: center; padding: 4px 0 20px; } .brand .mk { display: block; } .me { justify-content: center; } }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { flex-direction: row; padding: 8px 12px; align-items: center; gap: 6px; }
    .rail .brand { padding: 0 6px 0 0; } .rail .brand .full, .rail .brand span { display: none; } .rail .brand .mk { display: block; width: 30px; height: 30px; } .navlabel, .me, .live { display: none; }
    .nav { width: auto; padding: 8px 12px; } .nav .count { position: static; }
    .list, .detail { grid-row: 2; grid-column: 1; min-height: 0; }
    .shell.has-sel .list { display: none; } .shell:not(.has-sel) .detail { display: none; }
    .back { display: block; } .dhead { gap: 10px; } .dhead .btn .lbl { display: none; } .dhead .btn { padding: 9px; } .dhead, .dbody, .reply { padding-left: 16px; padding-right: 16px; }
    .m { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <nav class="rail">
    <div class="brand"><img src="/static/brand/logo-white.png" alt="Shopio" class="full"><img src="/static/brand/mark.png" alt="Shopio" class="mk"><span>Support Console</span></div>
    <div class="navlabel">Inbox</div>
    <button class="nav" data-view="approvals" aria-current="true" title="Approvals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
      <span>Approvals</span><b class="count" id="cApprovals">0</b></button>
    <button class="nav" data-view="chats" aria-current="false" title="Live chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <span>Conversations</span><b class="count" id="cChats">0</b></button>
    <div class="me">
      <div class="av" id="meAv">S</div>
      <div><input id="meName" aria-label="Your display name"><small>Supervisor · online</small></div>
    </div>
    <div class="live" id="live"><i></i><span>Live updates</span></div>
  </nav>

  <section class="list">
    <header>
      <h2 id="listTitle">Approvals</h2>
      <p id="listSub">Tool calls waiting for a human decision</p>
      <div class="seg" id="seg"></div>
    </header>
    <div class="items" id="items"></div>
  </section>

  <section class="detail" id="detail">
    <div class="placeholder"><div>
      <img src="/static/brand/mascot-6.png" alt="">
      <b>Welcome back</b><p>Pick an approval or a conversation to get started.</p></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
const initials = n => (n || '?').trim().split(/\s+/).map(w => [...w][0]).slice(0, 2).join('').toUpperCase();
function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 45) return 'now'; if (s < 3600) return Math.round(s / 60) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h'; return new Date(ts * 1000).toLocaleDateString();
}
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const ICON = {
  issue_refund: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 12l4-4M3 12l4 4"/><path d="M21 6v12"/></svg>',
  request_budget_approval: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  bot: '<img src="/static/brand/avatar.png" alt="" style="width:20px;height:20px;border-radius:50%">',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
const TOOL = {
  issue_refund: { label: 'Refund', cls: 'refund',
    mech: 'The agent called <code>issue_refund</code>, which has <code>require_confirmation</code>. ADK paused the call; your decision is sent back as an <code>adk_request_confirmation</code> response and the refund runs only if you approve.' },
  request_budget_approval: { label: 'Budget request', cls: 'budget',
    mech: '<code>request_budget_approval</code> is a <code>LongRunningFunctionTool</code>. It returned "pending" and the customer kept chatting; your decision is delivered later as the final function response.' },
};
const MODE = { ai: ['ai', 'Shopio AI handling'], queued: ['queued', 'Waiting for agent'], active: ['active', 'Human agent'] };

let convs = {}, approvals = {}, view = 'approvals', filter = { approvals: 'pending', chats: 'open' };
let sel = null, transcript = [], notes = {}, drafts = {}, lastTyping = 0;
const me = () => $('meName').value.trim() || 'Supervisor';

/* ---------- list ---------- */
const SEGS = { approvals: [['pending', 'Pending'], ['done', 'Decided'], ['all', 'All']], chats: [['open', 'Needs a human'], ['all', 'All chats']] };

function counts() {
  const p = Object.values(approvals).filter(a => a.status === 'pending').length;
  const q = Object.values(convs).filter(c => c.mode === 'queued').length;
  $('cApprovals').textContent = p; $('cApprovals').classList.toggle('hot', p > 0);
  $('cChats').textContent = q || Object.values(convs).filter(c => c.mode === 'active').length;
  $('cChats').classList.toggle('hot', q > 0);
  document.title = (p + q) ? `(${p + q}) Support Console` : 'Support Console';
}

function renderList() {
  counts();
  $('listTitle').textContent = view === 'approvals' ? 'Approvals' : 'Conversations';
  $('listSub').textContent = view === 'approvals' ? 'Tool calls waiting for a human decision' : 'Customers who asked for a person, and live AI chats';
  $('seg').innerHTML = SEGS[view].map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter[view] === k}">${l}</button>`).join('');
  let html = '';
  if (view === 'approvals') {
    const f = filter.approvals;
    const rows = Object.values(approvals)
      .filter(a => f === 'all' || (f === 'pending' ? a.status === 'pending' : a.status !== 'pending'))
      .sort((a, b) => f === 'pending' ? a.created_at - b.created_at : b.created_at - a.created_at);
    html = rows.map(a => {
      const t = TOOL[a.tool] || { label: a.tool, cls: 'refund' };
      return `<button class="item" data-type="approval" data-id="${esc(a.id)}" aria-current="${sel?.type === 'approval' && sel.id === a.id}">
        <div class="av ${t.cls}">${ICON[a.tool] || ICON.issue_refund}</div>
        <div class="body"><div class="l1"><b>${esc(t.label)} · ${esc(a.customer)}</b><time>${ago(a.created_at)}</time></div>
          <div class="l2"><span class="amount-sm">${a.args.amount != null ? money(a.args.amount) : ''}</span> · ${esc(a.args.reason || '')}</div>
          <div class="l3"><span class="pill ${esc(a.status)}">${esc(a.status)}</span></div></div></button>`;
    }).join('') || empty(f === 'pending' ? ['All caught up', 'New approval requests appear here instantly.'] : ['Nothing here yet', '']);
  } else {
    const rank = { queued: 0, active: 1, ai: 2 };
    const rows = Object.values(convs)
      .filter(c => filter.chats === 'all' || c.mode !== 'ai')
      .sort((a, b) => rank[a.mode] - rank[b.mode] || (a.mode === 'queued' ? a.updated_at - b.updated_at : b.updated_at - a.updated_at));
    html = rows.map(c => {
      const lm = c.last_message, [cls, label] = MODE[c.mode];
      const who = lm ? (lm.role === 'customer' ? '' : lm.role === 'human' ? lm.author + ': ' : lm.role === 'ai' ? 'Shopio AI: ' : '') : '';
      return `<button class="item" data-type="chat" data-id="${esc(c.id)}" aria-current="${sel?.type === 'chat' && sel.id === c.id}">
        <div class="av person">${esc(initials(c.customer))}</div>
        <div class="body"><div class="l1"><b>${esc(c.customer)}</b><time>${ago(c.updated_at)}</time></div>
          <div class="l2">${c.mode === 'queued' && c.handoff_reason ? esc(c.handoff_reason) : esc(who + (lm?.text || 'New conversation'))}</div>
          <div class="l3"><span class="pill ${cls}">${label}${c.mode === 'active' && c.agent_name ? ' · ' + esc(c.agent_name) : ''}</span></div></div></button>`;
    }).join('') || empty(filter.chats === 'open' ? ['No one is waiting', 'When a customer asks for a person, their chat lands here.'] : ['No conversations yet', 'Open the customer chat at / to start one.']);
  }
  $('items').innerHTML = html;
}
function empty([t, s]) {
  return `<div class="empty"><img src="/static/brand/${t === 'All caught up' || t === 'No one is waiting' ? 'mascot-5' : 'mascot-2'}.png" alt=""><b>${t}</b>${s}</div>`;
}

/* ---------- detail ---------- */
function txHtml(msgs) {
  return msgs.map(m => {
    if (m.role === 'system') return `<div class="sys">${esc(m.text)}</div>`;
    if (m.role === 'approval') {
      const a = approvals[m.approval_id]; if (!a) return '';
      return `<button class="apref" data-open-approval="${esc(a.id)}">${esc((TOOL[a.tool] || {}).label || a.tool)} #${esc(a.id)} · ${a.args.amount != null ? money(a.args.amount) : ''} · <b>${esc(a.status)}</b></button>`;
    }
    const who = m.role === 'customer' ? m.author : m.role === 'ai' ? 'Shopio AI' : m.author;
    return `<div class="m ${m.role}"><div class="who">${m.role === 'ai' ? '<img src="/static/brand/avatar.png" alt="">' : ''}${esc(who)}</div><div class="b">${esc(m.text)}</div></div>`;
  }).join('');
}

function head(avatar, title, sub, actions = '') {
  return `<div class="dhead"><button class="back" data-back aria-label="Back">${ICON.back}</button>${avatar}
    <div class="t"><h3>${title}</h3><div class="s">${sub}</div></div>${actions}</div>`;
}

function renderDetail() {
  $('shell').classList.toggle('has-sel', !!sel);
  if (!sel) return;
  const d = $('detail');
  if (sel.type === 'approval') {
    const a = approvals[sel.id], c = convs[a.session_id] || {};
    const t = TOOL[a.tool] || { label: a.tool, cls: 'refund', mech: '' };
    const pending = a.status === 'pending';
    const facts = [['Customer', a.customer], ...Object.entries(a.args).filter(([k]) => k !== 'amount').map(([k, v]) => [k.replace(/_/g, ' ').replace(/^./, s => s.toUpperCase()), v]),
                   ['Requested', new Date(a.created_at * 1000).toLocaleString()]];
    d.innerHTML = head(`<div class="av ${t.cls}" style="border-radius:12px">${ICON[a.tool] || ''}</div>`,
        `${esc(t.label)} <span style="color:var(--faint);font-weight:500">#${esc(a.id)}</span>`,
        `<span class="pill ${esc(a.status)}">${esc(a.status)}</span><span>from ${esc(a.customer)}</span>`) +
      `<div class="dbody">
        <div class="card">
          <div class="ap-hero"><div><div class="lbl">Amount</div><div class="big">${a.args.amount != null ? money(a.args.amount) : '—'}</div></div></div>
          <dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
          ${pending ? `<div class="decide" style="border-top:1px solid var(--border)">
              <label for="note">Note to the customer (optional)</label>
              <textarea id="note" placeholder="e.g. Approved, please keep receipts.">${esc(notes[a.id] || '')}</textarea>
              <div class="row"><button class="btn red" data-decide="0">${ICON.bad}Decline</button><button class="btn green" data-decide="1">${ICON.ok}Approve</button></div></div>`
            : `<div class="result ${esc(a.status)}">${a.status === 'approved' ? ICON.ok : ICON.bad}<div><b>${a.status === 'approved' ? 'Approved' : 'Declined'} by ${esc(a.decided_by)}</b>
               <span>${a.note ? '“' + esc(a.note) + '”' : 'No note'} · ${new Date(a.decided_at * 1000).toLocaleTimeString()}</span></div></div>`}
        </div>
        <div class="mech">${ICON.info}<div>${t.mech}</div></div>
        <div class="section-t">Conversation <button class="linkbtn" data-open-chat="${esc(a.session_id)}">Open chat →</button></div>
        <div class="card"><div class="tx mini" id="tx">${txHtml(transcript)}</div></div>
      </div>`;
    const tx = $('tx'); tx.scrollTop = tx.scrollHeight;
  } else {
    const c = convs[sel.id];
    const [cls, label] = MODE[c.mode];
    const mine = c.mode === 'active';
    const actions = mine ? `<button class="btn" data-release title="Hand back to AI">${ICON.bot}<span class="lbl">Hand back to Shopio AI</span></button>` : '';
    let foot;
    if (mine) {
      foot = `<div class="reply"><form id="replyForm"><textarea id="reply" rows="1" placeholder="Reply to ${esc(c.customer)}…">${esc(drafts[c.id] || '')}</textarea>
        <button class="btn primary" style="height:44px">${ICON.send}Send</button></form>
        <div class="bar"><span>The AI is paused while you're in this chat (<code>before_model_callback</code>).</span><span>Enter to send · Shift+Enter for a new line</span></div></div>`;
    } else {
      const msg = c.mode === 'queued' ? `${esc(c.customer)} asked for a person ${ago(c.updated_at) === 'now' ? 'just now' : ago(c.updated_at) + ' ago'}. The AI has stepped aside.`
                                      : 'Shopio AI is handling this chat. You can take over at any time.';
      foot = `<div class="reply"><div class="takeover"><p>${msg}</p>
        <button class="btn primary" data-join>${ICON.hand}${c.mode === 'queued' ? 'Accept chat' : 'Take over from AI'}</button></div></div>`;
    }
    d.innerHTML = head(`<div class="av">${esc(initials(c.customer))}</div>`, esc(c.customer),
        `<span class="pill ${cls}">${label}${mine ? ' · ' + esc(c.agent_name) : ''}</span><span>started ${new Date(c.created_at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`, actions) +
      `<div class="dbody" id="txBody">
        ${c.handoff_reason ? `<div class="callout">${ICON.hand}<div><b>Handoff reason</b><br>${esc(c.handoff_reason)}</div></div>` : ''}
        <div class="tx" id="tx">${txHtml(transcript)}</div></div>` + foot;
    $('txBody').scrollTop = $('txBody').scrollHeight;
    $('reply')?.focus();
  }
}

async function select(type, id) {
  sel = { type, id }; transcript = [];
  const sessionId = type === 'approval' ? approvals[id].session_id : id;
  renderList(); renderDetail();
  const res = await fetch(`/api/console/conversations/${sessionId}`);
  if (res.ok && sel?.id === id) { transcript = (await res.json()).messages; renderDetail(); }
}
const selSession = () => !sel ? null : sel.type === 'approval' ? approvals[sel.id]?.session_id : sel.id;

/* ---------- actions ---------- */
async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  if (!res.ok) { toast((await res.json().catch(() => ({}))).detail || 'Something went wrong'); throw new Error(); }
  return res.json();
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }

document.addEventListener('click', async e => {
  const t = e.target;
  const nav = t.closest('.nav');
  if (nav) { view = nav.dataset.view; document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', n === nav)); renderList(); return; }
  const seg = t.closest('[data-f]'); if (seg) { filter[view] = seg.dataset.f; renderList(); return; }
  const item = t.closest('.item'); if (item) { select(item.dataset.type, item.dataset.id); return; }
  if (t.closest('[data-back]')) { sel = null; renderList(); renderDetail(); return; }
  const oc = t.closest('[data-open-chat]');
  if (oc) { view = 'chats'; filter.chats = 'all'; document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.view === 'chats')); select('chat', oc.dataset.openChat); return; }
  const oa = t.closest('[data-open-approval]');
  if (oa) { view = 'approvals'; filter.approvals = 'all'; document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.view === 'approvals')); select('approval', oa.dataset.openApproval); return; }
  const dec = t.closest('[data-decide]');
  if (dec) {
    document.querySelectorAll('[data-decide]').forEach(b => b.disabled = true);
    const approved = dec.dataset.decide === '1';
    try { await post(`/api/console/approvals/${sel.id}`, { approved, note: notes[sel.id] || '', agent_name: me() }); toast(approved ? 'Approved, the agent will continue' : 'Declined, the customer has been told'); }
    catch { document.querySelectorAll('[data-decide]').forEach(b => b.disabled = false); }
    return;
  }
  if (t.closest('[data-join]')) { try { await post(`/api/console/conversations/${sel.id}/join`, { agent_name: me() }); } catch {} return; }
  if (t.closest('[data-release]')) { try { await post(`/api/console/conversations/${sel.id}/release`); toast('Chat handed back to Shopio AI'); } catch {} return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'note') notes[sel.id] = e.target.value;
  if (e.target.id === 'reply') {
    drafts[sel.id] = e.target.value;
    e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px';
    if (Date.now() - lastTyping > 2000) { lastTyping = Date.now(); fetch(`/api/console/conversations/${sel.id}/typing`, { method: 'POST' }); }
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'reply' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('replyForm').requestSubmit(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'replyForm') return;
  e.preventDefault();
  const text = $('reply').value.trim(); if (!text) return;
  const id = sel.id; $('reply').value = ''; drafts[id] = '';
  try { await post(`/api/console/conversations/${id}/messages`, { text, agent_name: me() }); } catch { drafts[id] = text; renderDetail(); }
});

/* ---------- live ---------- */
function applyEvent(ev) {
  if (ev.type === 'conversation') {
    convs[ev.conversation.id] = ev.conversation;
    renderList();
    if (sel?.type === 'chat' && sel.id === ev.conversation.id) {
      const focusedReply = document.activeElement?.id === 'reply';
      const prevMode = $('detail').dataset.mode; $('detail').dataset.mode = ev.conversation.mode;
      if (prevMode !== ev.conversation.mode || !focusedReply) renderDetail();
    }
  } else if (ev.type === 'approval') {
    const isNew = !approvals[ev.approval.id];
    approvals[ev.approval.id] = ev.approval;
    renderList();
    if (isNew && ev.approval.status === 'pending') toast(`New ${(TOOL[ev.approval.tool] || {}).label || 'approval'} from ${ev.approval.customer}`);
    if (sel?.type === 'approval' && sel.id === ev.approval.id) renderDetail();
  } else if (ev.type === 'message' && ev.session_id === selSession()) {
    if (!transcript.some(m => m.id === ev.message.id)) {
      transcript.push(ev.message);
      const tx = $('tx');
      if (tx) { tx.innerHTML = txHtml(transcript); const sc = $('txBody') || tx; sc.scrollTop = sc.scrollHeight; }
    }
  }
}

async function snapshot() {
  const s = await (await fetch('/api/console/snapshot')).json();
  convs = Object.fromEntries(s.conversations.map(c => [c.id, c]));
  approvals = Object.fromEntries(s.approvals.map(a => [a.id, a]));
  if (sel && !(sel.type === 'approval' ? approvals[sel.id] : convs[sel.id])) sel = null;
  renderList();
  if (sel) select(sel.type, sel.id);
}
function connect() {
  const es = new EventSource('/api/console/stream');
  es.onopen = () => { $('live').classList.remove('off'); snapshot(); };
  es.onerror = () => $('live').classList.add('off');
  es.onmessage = e => applyEvent(JSON.parse(e.data));
}

$('meName').value = store.get('agentName') || 'Supervisor';
$('meAv').textContent = initials(me());
$('meName').addEventListener('input', () => { store.set('agentName', me()); $('meAv').textContent = initials(me()); });
renderList();
connect();
setInterval(renderList, 30000); // keep relative times fresh
</script>
</body>
</html>
